<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectromorphology — Калейдоскопический бумажный визуализатор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050608;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 24px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      z-index: 10;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    #hud h1 {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #hud p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Spectromorphology</h1>
    <p id="hud-subtitle">Мандала бумажных мазков · Рыбья кинематика</p>
    <div id="hud-debug" style="display: none; margin-top: 6px; padding: 3px 8px; background: rgba(255, 238, 68, 0.15); border: 1px solid rgba(255, 238, 68, 0.35); border-radius: 4px; color: #ffee44; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;">
      🖌 РЕЖИМ КИСТИ (DEBUG): ОДИНАРНАЯ ТРАЕКТОРИЯ И ОСИ СИММЕТРИИ
    </div>
    <div id="hud-perf" style="margin-top: 8px; font-family: monospace; font-size: 11px; color: #a0aec0; background: rgba(10, 15, 25, 0.65); padding: 5px 9px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.08); display: inline-flex; align-items: center; gap: 8px;">
      <span id="perf-fps" style="font-weight: 700; color: #48bb78;">-- FPS</span>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span id="perf-frametime">-- ms</span>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span id="perf-cpu">CPU: -- ms</span>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span id="perf-draws">-- calls · -- tris</span>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span id="perf-fbo" style="color: #90cdf4;">1536px</span>
    </div>
  </div>
  <div id="hud-toast" style="display: none; position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(72, 187, 120, 0.55); color: #48bb78; padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(72, 187, 120, 0.2); z-index: 1000; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;">
    ✅ Параметры успешно сохранены в localStorage
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
