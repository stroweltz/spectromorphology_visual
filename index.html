<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spectromorphology — Калейдоскопический бумажный визуализатор</title>

  <!-- HTTP Cache Invalidation -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050608;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #bloom-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(12px) saturate(1.35);
      opacity: 0;
      display: none;
      transform: scale(1.03);
      z-index: 2;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }
    #ui-root {
      position: relative;
      z-index: 30;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #ui-root > * {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <!-- WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Soft Ethereal Bloom / Glow Overlay -->
  <canvas id="bloom-canvas"></canvas>

  <!-- Control Rack UI Overlay -->
  <div id="ui-root"></div>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      try {
        fetch('/api/error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: String(msg), url, line, col, stack: error ? error.stack : '' })
        }).catch(function() {});
      } catch(e) {}
    };
    window.addEventListener('unhandledrejection', function(event) {
      try {
        fetch('/api/error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: 'Unhandled rejection: ' + (event.reason ? (event.reason.message || event.reason) : 'unknown'), stack: event.reason ? event.reason.stack : '' })
        }).catch(function() {});
      } catch(e) {}
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
